<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTasker Pro — Організуй свій хаос</title>
    <style>
        /* Стилістика в дусі концепту Nothing */
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg: #000000;
            --fg: #ffffff;
            --muted: #666666;
            --border: #222222;
            --accent: #ff0000; /* Фірмова червона крапка Nothing */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Mono', monospace; }

        body {
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Навігація */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--accent); }

        /* Головний контент */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            flex: 1;
        }

        .hero-title {
            font-size: calc(2rem + 2vw);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 20px;
            max-width: 900px;
        }

        .hero-subtitle {
            color: var(--muted);
            font-size: 1rem;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Стильна кнопка */
        .btn-start {
            background-color: var(--fg);
            color: var(--bg);
            text-decoration: none;
            padding: 15px 40px;
            font-weight: 700;
            border-radius: 50px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 1px solid var(--fg);
            display: inline-block;
        }
        .btn-start:hover {
            background-color: var(--bg);
            color: var(--fg);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Футер */
        footer {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }

        /* Адаптивність для телефонів */
        @media (max-width: 600px) {
            header { padding: 20px; }
            .hero-title { letter-spacing: -1px; }
            .btn-start { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TeamTasker<span>.</span>Pro</div>
        <div style="color: var(--muted); font-size: 0.8rem;">v1.0.0_OS</div>
    </header>

    <main>
        <h1 class="hero-title">Capture. Organize. Tackle.</h1>
        <p class="hero-subtitle">Інтенсивний інструмент для управління технічними задачами та розробкою софту. Без зайвого шуму.</p>
        <a href="/board" class="btn-start">Відкрити дошку -></a>
    </main>

    <footer>
        <p>© 2026 TeamTasker Project. Натхненно мінімалізмом.</p>
    </footer>

</body>
</html>
