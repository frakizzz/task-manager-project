<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager — Дипломний проєкт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">Task Manager</h1>
            <p class="lead text-muted">Система управління задачами для дипломного проєкту</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-start border-4 border-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title m-0 fw-bold">Зварити балку для диплому</h5>
                            <span class="badge bg-danger">Високий пріоритет</span>
                        </div>
                        <p class="card-text text-secondary">Розрахувати зварні шви коробчастої балки для шлаковоза.</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="badge bg-success">В процесі</span>
                            <button class="btn btn-sm btn-outline-primary">Змінити статус</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
